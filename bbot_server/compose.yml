x-bbot-server-base: &bbot-server-base
  image: blacklanternsecurity/bbot-server:stable
  restart: unless-stopped
  volumes:
    - "${BBOT_SERVER_CONFIG:-~/.config/bbot_server/config.yml}:/home/bbot/.config/bbot_server/config.yml"
    - "${BBOT_REPORTS_DIR:-~/bbot-reports}:/home/bbot/bbot-reports"

services:
  server:
    <<: *bbot-server-base
    ports:
      - "${BBOT_LISTEN_ADDRESS:-127.0.0.1}:${BBOT_PORT:-8807}:8807"
    command: ["bbctl", "server", "start", "--api-only", "--listen", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8807/v1/docs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - BBOT_SERVER_AUTH_ENABLED=${BBOT_SERVER_AUTH_ENABLED:-true}
      - BBOT_REPORTS_HOST_DIR=${BBOT_REPORTS_DIR:-~/bbot-reports}
    depends_on:
      - mongodb
      - redis

  worker:
    <<: *bbot-server-base
    command: ["bbctl", "server", "start", "--worker-only"]
    depends_on:
      server:
        condition: service_healthy

  agent:
    <<: *bbot-server-base
    command: ["bash", "/app/bbot_server/default_agent.sh"]
    environment:
      - BBOT_SERVER_RECONCILE_INDEXES=false
    depends_on:
      server:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - bbot-mongodb:/data/db

  redis:
    image: redis:latest
    restart: unless-stopped

volumes:
  bbot-mongodb:
